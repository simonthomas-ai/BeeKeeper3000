name: Monitor bridge security tests
on:
  push:
    paths:
      - "monitor-bridge/**"
      - "network/meshcore/**"
      - ".github/workflows/bridge-tests.yml"
  pull_request:
    paths:
      - "monitor-bridge/**"
      - ".github/workflows/bridge-tests.yml"
permissions:
  contents: read
jobs:
  bridge-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check monitor-bridge/bridge.mjs
      - name: Unit tests
        run: npm --prefix monitor-bridge test
