name: Linux station installer validation

on:
  push:
    paths:
      - "scripts/install-linux.sh"
      - "scripts/install-camera-linux.sh"
      - "docs/camera.env.example"
      - "deploy/systemd/**"
      - "docs/STATION-QUICKSTART-LINUX.md"
      - ".github/workflows/linux-station-scripts.yml"
  pull_request:
    paths:
      - "scripts/install-linux.sh"
      - "scripts/install-camera-linux.sh"
      - "docs/camera.env.example"
      - "deploy/systemd/**"
      - "docs/STATION-QUICKSTART-LINUX.md"
      - ".github/workflows/linux-station-scripts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: simonthomas-ai/Beekeeper-Monitor
          path: Beekeeper-Monitor
      - name: Validate installer syntax and non-destructive base preflight
        shell: bash
        run: |
          bash -n scripts/install-linux.sh
          bash -n scripts/install-camera-linux.sh
          bash scripts/install-linux.sh \
            --beekeeper-repo "$GITHUB_WORKSPACE" \
            --monitor-repo "$GITHUB_WORKSPACE/Beekeeper-Monitor" \
            --validate-only
      - name: Verify systemd hardening and camera fail-closed gates
        shell: bash
        run: |
          for unit in deploy/systemd/*.service; do
            grep -q '^User=beekeeper$' "$unit"
            grep -q '^ProtectSystem=strict$' "$unit"
            grep -q '^ProtectHome=true$' "$unit"
            grep -q '^NoNewPrivileges=true$' "$unit"
            grep -q '^ReadWritePaths=/var/lib/beekeeper3000$' "$unit"
          done
          grep -q '"BEEKEEPER_MONITOR_INGEST_TOKEN": monitor_token' scripts/install-linux.sh
          grep -q 'Monitor and bridge receiver tokens do not match' scripts/install-linux.sh
          grep -q 'ExecStart=/opt/beekeeper3000/venv-camera/bin/python -m camera.runtime' deploy/systemd/beekeeper-camera.service
          grep -q 'ConditionPathExists=/var/lib/beekeeper3000/models/manifest.json' deploy/systemd/beekeeper-camera.service
          grep -q 'load_manifest(sys.argv\[1\], verify_model=True)' scripts/install-camera-linux.sh
          grep -q 'No images or model weights were downloaded' scripts/install-camera-linux.sh
          if grep -Eq '0\.0\.0\.0|:::' deploy/systemd/*.service; then
            echo "Systemd service definitions must not declare public listener addresses." >&2
            exit 1
          fi
