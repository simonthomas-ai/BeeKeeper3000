name: LLM Council (zero-cost)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Self-hosted runner only: GitHub-hosted compute is not assumed free.
# The runner owner is responsible for keeping the host powered and secured.
jobs:
  council:
    if: github.repository == 'simonthomas-ai/BeeKeeper3000' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, llm-council]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Python
        shell: pwsh
        run: python --version
      - name: Run safety tests
        shell: pwsh
        run: python -m unittest tests.test_llm_council -v
      - name: Run council
        shell: pwsh
        run: |
          $reportDir = Join-Path $env:USERPROFILE 'BEEKEEPER3000\llm-council\runs'
          python tools/llm_council.py --output $reportDir
