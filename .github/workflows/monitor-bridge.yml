name: Monitor bridge tests
on:
  push:
    paths:
      - "monitor-bridge/**"
      - ".github/workflows/monitor-bridge.yml"
  pull_request:
    paths:
      - "monitor-bridge/**"
      - ".github/workflows/monitor-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check bridge
        run: node --check monitor-bridge/bridge.mjs
      - name: Run bridge tests
        run: npm --prefix monitor-bridge test
