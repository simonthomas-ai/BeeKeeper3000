name: Network reference tests

on:
  push:
    paths:
      - "network/**"
      - "monitor-bridge/**"
      - ".github/workflows/network-tests.yml"
  pull_request:
    paths:
      - "network/**"
      - "monitor-bridge/**"
      - ".github/workflows/network-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run triangulation tests
        run: python -m unittest network.test_triangulation -v


  monitor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bridge contract, privacy and retry tests
        working-directory: monitor-bridge
        run: node --test bridge.test.mjs

  meshcore-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install optional MeshCore binding
        run: python -m pip install -r network/meshcore/requirements.lock
      - name: Test signed MeshCore protocol, receiver, persistent store and transport
        run: python -m unittest network.meshcore.test_protocol network.meshcore.test_receiver network.meshcore.test_event_store network.meshcore.test_transport -v
