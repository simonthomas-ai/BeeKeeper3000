name: Network reference tests

on:
  push:
    paths:
      - "network/**"
      - "camera/**"
      - "camera/**"
      - "monitor-bridge/**"
      - ".github/workflows/network-tests.yml"
  pull_request:
    paths:
      - "network/**"
      - "camera/**"
      - "monitor-bridge/**"
      - ".github/workflows/network-tests.yml"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run network and local camera pipeline tests
        run: >-
          python -m unittest
          network.test_triangulation network.test_triangulation_field_report network.test_source_api network.test_source_backup
          camera.test_contracts camera.test_model_manifest camera.test_outbox
          camera.test_outbox_backup camera.test_source_client camera.test_runtime -v

  monitor-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run bridge contract, privacy and retry tests
        working-directory: monitor-bridge
        run: node --test bridge.test.mjs

  meshcore-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install optional MeshCore binding
        run: python -m pip install -r network/meshcore/requirements.lock
      - name: Test signed MeshCore protocol, receiver, persistent store and transport
        run: python -m unittest network.meshcore.test_protocol network.meshcore.test_receiver network.meshcore.test_event_store network.meshcore.test_transport network.meshcore.test_hardware_probe -v
