name: Network reference tests

on:
  push:
    paths:
      - "network/**"
      - ".github/workflows/network-tests.yml"
  pull_request:
    paths:
      - "network/**"
      - ".github/workflows/network-tests.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional MeshCore protocol dependency
        run: python -m pip install -r network/meshcore/requirements.txt
      - name: Run network and MeshCore protocol tests
        run: python -m unittest discover -s network -p 'test_*.py' -v

  meshcore-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional MeshCore binding
        run: python -m pip install -r network/meshcore/requirements.txt
      - name: Test signed MeshCore event protocol
        run: python -m unittest network.meshcore.test_protocol -v
