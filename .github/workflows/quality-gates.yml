name: Quality gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core and safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify immutable GitHub Actions references
        run: |
          python -m unittest scripts.test_audit_workflow_action_pins -v
          python scripts/audit_workflow_action_pins.py
      - name: Run dependency-free core and LLM safety tests
        run: python -m unittest network.test_triangulation network.test_geojson tests.test_llm_council tests.test_mobile_export_import -v
      - name: Run shared adapter lifecycle and privacy contract tests
        run: python -m unittest adapters.test_lifecycle -v
      - name: Run local image and video adapter safety tests
        run: python -m unittest adapters.test_local_media scripts.test_import_local_media -v
      - name: Install pinned optional MeshCore runtime
        run: python -m pip install --disable-pip-version-check --requirement network/meshcore/requirements.lock
      - name: Check Python environment
        run: python -m pip check
      - name: Run MeshCore protocol, receiver, persistence and transport tests
        run: >-
          python -m unittest
          network.meshcore.test_protocol
          network.meshcore.test_receiver
          network.meshcore.test_event_store
          network.meshcore.test_transport
          -v

  camera-runtime:
    name: Camera runtime safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional CPU camera runtime
        run: python -m pip install --disable-pip-version-check --requirement camera/requirements.txt
      - name: Check camera runtime environment
        run: python -m pip check
      - name: Run camera and durable-outbox tests
        run: python -m unittest discover -s camera -p 'test_*.py' -v

  camera-runtime-windows:
    name: Windows camera runtime compatibility tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install optional CPU camera runtime
        run: python -m pip install --disable-pip-version-check --requirement camera/requirements.txt
      - name: Check Windows Python environment
        run: python -m pip check
      - name: Parse the Windows camera launcher without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($script in @("scripts/Start-BeeKeeperCamera.ps1", "scripts/Test-BeeKeeperCamera.ps1", "scripts/Import-BeeKeeperMobileExport.ps1", "scripts/Set-VespaGuardBranchProtection.ps1")) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run camera and durable-outbox tests on Windows
        run: python -m unittest discover -s camera -p 'test_*.py' -v

  monitor-bridge:
    name: Monitor bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor-bridge/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm --prefix monitor-bridge ci --ignore-scripts --no-audit --no-fund
      - name: Run bridge tests
        run: npm --prefix monitor-bridge test
      - name: Check mobile PWA syntax and contracts
        run: |
          node --check mobile-pwa/app.mjs
          node --check mobile-pwa/sw.js
          node --test mobile-pwa/*.test.mjs
