name: Supply-chain audit and SBOM

on:
  push:
    paths:
      - "monitor-bridge/package.json"
      - "monitor-bridge/package-lock.json"
      - "network/meshcore/requirements*.txt"
      - "network/meshcore/requirements.lock"
      - "camera/requirements.txt"
      - "camera/**/*.py"
      - "adapters/**/*.py"
      - "adapters/*.lock"
      - "docs/NMEA-GNSS-HEADING-ADAPTER.md"
      - "network/meshcore/**/*.py"
      - "monitor-bridge/**/*.js"
      - "monitor-bridge/**/*.mjs"
      - "scripts/**/*.py"
      - "scripts/**/*.ps1"
      - "training/**/*.py"
      - "training/requirements*.txt"
      - "training/**/*.lock"
      - "LICENSES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "PROVENANCE.md"
      - "OPEN_SOURCE_COMPONENTS.md"
      - "docs/UPSTREAM-SECURITY-LICENSE-REGISTER-2026-11-20.md"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    paths:
      - "camera/requirements.txt"
      - "camera/**/*.py"
      - "adapters/**/*.py"
      - "adapters/*.lock"
      - "docs/NMEA-GNSS-HEADING-ADAPTER.md"
      - "network/meshcore/**/*.py"
      - "monitor-bridge/**/*.js"
      - "monitor-bridge/**/*.mjs"
      - "scripts/**/*.py"
      - "scripts/**/*.ps1"
      - "training/**/*.py"
      - "training/requirements*.txt"
      - "training/**/*.lock"
      - "monitor-bridge/package.json"
      - "monitor-bridge/package-lock.json"
      - "network/meshcore/requirements*.txt"
      - "network/meshcore/requirements.lock"
      - "LICENSES.md"
      - "THIRD_PARTY_NOTICES.md"
      - "PROVENANCE.md"
      - "OPEN_SOURCE_COMPONENTS.md"
      - "docs/UPSTREAM-SECURITY-LICENSE-REGISTER-2026-11-20.md"
      - ".github/workflows/supply-chain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-vulnerability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit all pinned optional MeshCore packages
        run: |
          mkdir -p reports
          pip-audit --requirement network/meshcore/requirements.lock --no-deps --strict --format json --output reports/pip-audit.json

      - name: Audit optional NMEA serial dependency
        run: pip-audit --requirement adapters/nmea-requirements.lock --no-deps --strict --format json --output reports/nmea-serial-audit.json
      - name: Audit pinned training runtime and resolved dependencies
        run: pip-audit --requirement training/requirements-training.txt --strict --format json --output reports/training-runtime-audit.json

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-vulnerability-audit
          path: |
            reports/pip-audit.json
            reports/nmea-serial-audit.json
            reports/training-runtime-audit.json
          if-no-files-found: ignore
          retention-days: 30

  python-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned CycloneDX generator
        run: python -m pip install --disable-pip-version-check "cyclonedx-bom==9.0.0"
      - name: Generate validated CycloneDX SBOM for optional MeshCore lock
        run: |
          mkdir -p reports
          cyclonedx-py requirements network/meshcore/requirements.lock --spec-version 1.6 --output-format JSON --output-reproducible --output-file reports/meshcore-runtime.cdx.json
          python -m json.tool reports/meshcore-runtime.cdx.json >/dev/null
      - name: Generate CycloneDX SBOM for optional NMEA serial dependency
        run: |
          cyclonedx-py requirements adapters/nmea-requirements.lock --spec-version 1.6 --output-format JSON --output-reproducible --output-file reports/nmea-serial.cdx.json
          python -m json.tool reports/nmea-serial.cdx.json >/dev/null
      - name: Generate CycloneDX SBOM for declared training runtime dependencies
        run: |
          cyclonedx-py requirements training/requirements-training.txt --spec-version 1.6 --output-format JSON --output-reproducible --output-file reports/training-declared-requirements.cdx.json
          python -m json.tool reports/training-declared-requirements.cdx.json >/dev/null

      - name: Upload NMEA serial SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmea-serial-cyclonedx-sbom
          path: reports/nmea-serial.cdx.json
          retention-days: 90

      - name: Upload declared training dependency SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: training-declared-requirements-cyclonedx-sbom
          path: reports/training-declared-requirements.cdx.json
          retention-days: 90

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meshcore-runtime-cyclonedx-sbom
          path: reports/meshcore-runtime.cdx.json
          retention-days: 90

  camera-runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit camera runtime dependency graph
        run: |
          mkdir -p reports
          pip-audit --requirement camera/requirements.txt --strict --format json --output reports/camera-runtime-audit.json
      - name: Upload camera vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-runtime-vulnerability-audit
          path: reports/camera-runtime-audit.json
          if-no-files-found: ignore
          retention-days: 30

  camera-runtime-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned optional camera runtime in an isolated environment
        run: |
          python -m venv /tmp/beekeeper-camera-runtime
          /tmp/beekeeper-camera-runtime/bin/python -m pip install --disable-pip-version-check --requirement camera/requirements.txt
          /tmp/beekeeper-camera-runtime/bin/python -m pip check
      - name: Install pinned CycloneDX generator
        run: python -m pip install --disable-pip-version-check "cyclonedx-bom==9.0.0"
      - name: Generate reproducible CycloneDX SBOM from installed camera runtime
        run: |
          mkdir -p reports
          cyclonedx-py environment /tmp/beekeeper-camera-runtime --spec-version 1.6 --output-format JSON --output-reproducible --output-file reports/camera-runtime.cdx.json
          python -m json.tool reports/camera-runtime.cdx.json >/dev/null
      - name: Upload camera runtime SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-runtime-cyclonedx-sbom
          path: reports/camera-runtime.cdx.json
          retention-days: 90

  npm-vulnerability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor-bridge/package-lock.json
      - name: Install exactly the locked Node.js dependency tree
        run: npm --prefix monitor-bridge ci --ignore-scripts --no-audit --no-fund
      - name: Audit Node.js dependencies
        run: npm --prefix monitor-bridge audit --audit-level=low
