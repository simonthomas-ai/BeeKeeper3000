name: Audit upstream Waspinator model metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waspinator-upstream-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Fetch and inspect metadata only (no model execution)
        env:
          UPSTREAM_REPO: gitDew/waspinator
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          base="https://api.github.com/repos/"+os.environ["UPSTREAM_REPO"]
          def get(url):
              request=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","User-Agent":"BeeKeeper3000-Model-Audit"})
              with urllib.request.urlopen(request,timeout=25) as response:
                  return json.load(response)
          repo=get(base)
          if repo.get("full_name")!="gitDew/waspinator":
              raise SystemExit("unexpected upstream")
          ref=repo["default_branch"]
          tree=get(base+"/git/trees/"+ref+"?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("upstream tree truncated; refusing incomplete audit")
          wanted=["LICENSE.txt","models/attributions.txt","models/yolo26s-waspinator-chamber.pt","models/yolo26n-waspinator-chamber_ncnn_model/model.ncnn.bin","models/yolo26n-waspinator-chamber_ncnn_model/metadata.yaml"]
          files={item["path"]:item for item in tree["tree"] if item["type"]=="blob"}
          lines=["## Upstream Waspinator metadata audit","Upstream repository: https://github.com/gitDew/waspinator","Upstream commit: `"+tree["sha"]+"`","","| File | Present | Bytes | Git blob SHA |","|---|---|---:|---|"]
          for path in wanted:
              item=files.get(path)
              lines.append("| `"+path+"` | "+("yes" if item else "NO")+" | "+(str(item["size"]) if item else "—")+" | "+(item["sha"] if item else "—")+" |")
          lines += ["","**No model weights were downloaded or executed.** Git blob hashes are not SHA-256. No independent inference/accuracy or training-data rights have been verified. **Not approved for production.**"]
          report="\n".join(lines)+"\n"
          Path("waspinator-upstream-audit.md").write_text(report,encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write(report)
          if any(path not in files for path in wanted):
              raise SystemExit("required upstream metadata missing")
          PY
      - name: Preserve audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waspinator-upstream-metadata
          path: waspinator-upstream-audit.md
          if-no-files-found: warn
          retention-days: 30
