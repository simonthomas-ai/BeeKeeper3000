name: Verify isolated Waspinator model SHA256
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waspinator-weight-sha256.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download reviewed upstream revision as inert bytes and calculate SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path

          owner, repo = "gitDew", "waspinator"
          pinned_commit = "7251be99a69dfc38f82abb062e22a0062ff5c58c"
          path = "models/yolo26n-waspinator-chamber_ncnn_model/model.ncnn.bin"
          expected_size = 9602112
          expected_git_blob = "19b5fb51fd63a09e4a74b2f4469bf399e21792bf"
          api = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "BeeKeeper3000-Weights-Audit",
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          upstream = get_json(api)
          if upstream.get("full_name") != "gitDew/waspinator":
              raise SystemExit("unexpected upstream repository")
          commit = get_json(api + "/commits/" + pinned_commit)
          if commit.get("sha") != pinned_commit:
              raise SystemExit("pinned upstream commit could not be verified")

          entry = get_json(api + "/contents/" + path + "?ref=" + pinned_commit)
          if (
              entry.get("type") != "file"
              or entry.get("size") != expected_size
              or entry.get("sha") != expected_git_blob
          ):
              raise SystemExit("pinned model path, byte count or Git blob changed; refusing download")

          url = f"https://raw.githubusercontent.com/{owner}/{repo}/{pinned_commit}/{path}"
          digest = hashlib.sha256()
          total = 0
          request = urllib.request.Request(
              url, headers={"User-Agent": "BeeKeeper3000-Weights-Audit"}
          )
          with urllib.request.urlopen(request, timeout=90) as response:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  total += len(chunk)
                  if total > expected_size:
                      raise SystemExit("download exceeded the pinned model byte count")
                  digest.update(chunk)

          if total != expected_size:
              raise SystemExit("downloaded model byte count does not match pinned metadata")

          sha256 = digest.hexdigest()
          report = f"""## Isolated upstream Waspinator weight checksum

          Source: https://github.com/{owner}/{repo}
          Pinned upstream commit: `{pinned_commit}`
          File: `{path}`
          Size: {total} bytes (expected exact size)
          Git blob: `{expected_git_blob}` (matched)
          SHA-256: `{sha256}`

          The bytes were read only to verify their checksum. The model was **not loaded, imported, executed, converted, trained, installed, activated, or redistributed**.
          This checksum does not verify the rights chain, training-image provenance, model accuracy or field suitability.
          **No license approval, no accuracy claim, no production release.**
          """
          Path("waspinator-weight-sha256.md").write_text(report, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(report)
          print("Verified pinned upstream commit, path, byte count and Git blob; computed SHA-256.")

          PY
      - name: Save checksum report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waspinator-weight-sha256-report
          path: waspinator-weight-sha256.md
          if-no-files-found: warn
          retention-days: 30
