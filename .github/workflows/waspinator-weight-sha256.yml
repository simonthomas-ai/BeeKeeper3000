name: Verify isolated Waspinator model SHA256
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/waspinator-weight-sha256.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download pinned upstream weights as inert bytes and calculate SHA256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          owner, repo = "gitDew", "waspinator"
          path = "models/yolo26n-waspinator-chamber_ncnn_model/model.ncnn.bin"
          api = f"https://api.github.com/repos/{owner}/{repo}"
          headers={"Accept":"application/vnd.github+json","User-Agent":"BeeKeeper3000-Weights-Audit","Authorization":"Bearer "+os.environ["GITHUB_TOKEN"]}
          def get_json(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:
                  return json.load(r)
          upstream=get_json(api)
          if upstream.get("full_name")!="gitDew/waspinator":
              raise SystemExit("unexpected upstream")
          commit=get_json(api+"/commits/"+upstream["default_branch"])["sha"]
          entry=get_json(api+"/contents/"+path+"?ref="+commit)
          if entry.get("type")!="file" or not isinstance(entry.get("size"),int) or not (1000000 <= entry["size"] <= 15000000):
              raise SystemExit("unexpected model size; refusing download")
          url=f"https://raw.githubusercontent.com/{owner}/{repo}/{commit}/{path}"
          h=hashlib.sha256()
          total=0
          with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"BeeKeeper3000-Weights-Audit"}),timeout=90) as r:
              while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  total+=len(chunk)
                  if total>15000000: raise SystemExit("download exceeded 15 MB safety cap")
                  h.update(chunk)
          if total!=entry["size"]:
              raise SystemExit("model byte count mismatch")
          digest=h.hexdigest()
          report=f"""## Isolated upstream Waspinator weight checksum

          Source: https://github.com/{owner}/{repo}
          Pinned upstream commit: \`{commit}\`
          File: \`{path}\`
          Size: {total} bytes
          SHA-256: \`{digest}\`
          Git blob SHA: \`{entry["sha"]}\`

          The model was **not loaded, imported, executed, redistributed, or installed**.
          SHA-256 records downloaded bytes, not independent trust or provenance of training images.
          **No license approval, no accuracy claim, no production release.**
          """
          Path("waspinator-weight-sha256.md").write_text(report,encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out: out.write(report)
          print("Verified byte count and computed SHA-256 for pinned upstream commit",commit)
          PY
      - name: Save checksum report only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: waspinator-weight-sha256-report
          path: waspinator-weight-sha256.md
          if-no-files-found: warn
          retention-days: 30
