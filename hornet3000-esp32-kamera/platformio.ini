; Hornet3000 ESP32-Kamera – Firmware für AI-Thinker ESP32-CAM (OV2640)
; pioarduino-Plattform (Arduino-ESP32 3.3.12), feste Fassung, damit der Bau wiederholbar bleibt.
[env:esp32cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D BOARD_HAS_PSRAM
    -Wall -Wextra -Wno-unused-parameter
build_src_filter = +<*>
